server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /app/web;
    index index.php index.html;
    server_tokens off;
    client_max_body_size 512m;
    add_header X-Request-ID $request_id always;
    location = /healthz {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/easyimage-health.php;
        fastcgi_pass 127.0.0.1:9000;
    }
    location ^~ /config/ { return 404; }
    location ^~ /admin/logs/ { return 404; }
    location ~ /\. { return 404; }
    location ~* ^/i/.*\.(php[0-9]*|phtml|phar)(/|$) { return 404; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param X_REQUEST_ID $request_id;
        fastcgi_read_timeout 180s;
        fastcgi_pass 127.0.0.1:9000;
    }
}
